<!DOCTYPE html>
<html>
<head>
    <meta charset="ISO-8859-1">
    <title>Welcome to eLibrary</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap.min.css"/>
</head>
<body>

<nav class="navbar navbar-inverse">
    <div class="container">
        <div class="navbar-header">
            <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1" aria-expanded="false">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="index.html">eLibrary</a>
        </div>

        <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
            <ul class="nav navbar-nav">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="#">Admin</a></li>
                <li><a href="#">Librarian</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <h1>eLibrary</h1>

    <div class="row">
        <!-- Admin Login -->
        <div class="col-md-6">
            <h3>Admin Login</h3>
            <form action="servlets.AdminLogin" method="post" style="width:300px">
                <div class="form-group">
                    <label for="adminEmail">Email address</label>
                    <input type="email" class="form-control" id="adminEmail" name="email" placeholder="Email" required/>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" class="form-control" id="adminPassword" name="password" placeholder="Password" required/>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>

        <!-- Librarian Login -->
        <div class="col-md-6">
            <h3>Librarian Login</h3>
            <form action="servlets.LibrarianLogin" method="post" style="width:300px">
                <div class="form-group">
                    <label for="librarianEmail">Email address</label>
                    <input type="email" class="form-control" id="librarianEmail" name="email" placeholder="Email" required/>
                </div>
                <div class="form-group">
                    <label for="librarianPassword">Password</label>
                    <input type="password" class="form-control" id="librarianPassword" name="password" placeholder="Password" required/>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS + jQuery -->
<script src="jquery.min.js"></script>
<script src="bootstrap.min.js"></script>
</body>
</html>
